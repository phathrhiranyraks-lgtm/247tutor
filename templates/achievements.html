<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ผลงานลูกศิษย์ - 24/7Tutor</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Kanit', sans-serif; 
            background-color: #f4f7f6; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
            text-align: center; 
        }
        
        .empty-state-box { 
            background: white; 
            padding: 50px 30px; 
            border-radius: 12px; 
            box-shadow: 0 8px 20px rgba(0,0,0,0.05); 
            max-width: 400px; 
            width: 90%; 
        }

        .icon { 
            font-size: 70px; 
            margin-bottom: 15px; 
            /* ทำให้ไอคอนดูเป็นสีเทาอ่อนๆ เหมือนยังไม่ถูกปลดล็อก */
            filter: grayscale(100%); 
            opacity: 0.5;
        }

        h2 { color: #333; margin: 0 0 10px 0; font-size: 24px; }
        
        p { color: #777; margin-bottom: 25px; line-height: 1.6; }
        
        .btn-back { 
            display: inline-block; 
            padding: 12px 25px; 
            background-color: #00a8ff; 
            color: white; 
            text-decoration: none; 
            border-radius: 8px; 
            font-weight: 600; 
            transition: background 0.3s; 
        }
        
        .btn-back:hover { background-color: #0088cc; }
    </style>
</head>
<body>

    <div class="empty-state-box">
        <!-- เปลี่ยนเป็นรูปภาพโล่รางวัล หรือไอคอนอื่นๆ ได้ตามต้องการ -->
        <div class="icon">🏆</div>
        
        <h2>ยังไม่มีความสำเร็จในขณะนี้</h2>
        <p>หน้าผลงานและรีวิวจากลูกศิษย์กำลังรอการอัปเดต<br>ความสำเร็จแรกของคอร์สนี้... อาจเป็นน้อง!</p>
        
        <a href="index.html" class="btn-back">กลับไปเริ่มเรียนฟิสิกส์กัน</a>
    </div>

</body>
</html>

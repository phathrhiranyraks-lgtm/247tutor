<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เข้าสู่ระบบ - PhysicsTutor</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Kanit', sans-serif; background-color: #f4f7f6; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-box { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 8px 20px rgba(0,0,0,0.1); text-align: center; width: 100%; max-width: 350px; }
        .social-btn { display: block; width: 100%; padding: 12px; margin-bottom: 15px; border: none; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; color: white; }
        .btn-google { background-color: #db4437; }
        .btn-facebook { background-color: #4267B2; }
        .social-btn:hover { opacity: 0.9; }
    </style>
</head>
<body>

    <div class="login-box">
        <h2>เข้าสู่ระบบเรียนออนไลน์</h2>
        <p style="color: #666; margin-bottom: 25px;">เลือกช่องทางเข้าสู่ระบบที่สะดวกที่สุด</p>
        
        <button id="btn-google" class="social-btn btn-google">G เข้าสู่ระบบด้วย Google</button>
        <button id="btn-facebook" class="social-btn btn-facebook">f เข้าสู่ระบบด้วย Facebook</button>
    </div>

    <!-- โหลดระบบ Firebase ผ่านอินเทอร์เน็ต -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.5.0/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, FacebookAuthProvider } from "https://www.gstatic.com/firebasejs/10.5.0/firebase-auth.js";

        // คอนฟิกที่ตั้งค่าไว้
        const firebaseConfig = {
          apiKey: "AIzaSyDCV8aHrVBp5FXxdMYG4nVf59kUJOMnpoY",
          authDomain: "physics-tutor-web.firebaseapp.com",
          projectId: "physics-tutor-web",
          storageBucket: "physics-tutor-web.firebasestorage.app",
          messagingSenderId: "232941095849",
          appId: "1:232941095849:web:2eb9bcc515e0c7cc00d2b8",
          measurementId: "G-W0GT3KNNXG"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        
        const googleProvider = new GoogleAuthProvider();
        const facebookProvider = new FacebookAuthProvider();

        // คำสั่งปุ่ม Google
        document.getElementById('btn-google').addEventListener('click', () => {
            signInWithPopup(auth, googleProvider)
                .then((result) => alert("ยินดีต้อนรับ: " + result.user.displayName))
                .catch((error) => alert("เกิดข้อผิดพลาด Google: " + error.message));
        });

        // คำสั่งปุ่ม Facebook
        document.getElementById('btn-facebook').addEventListener('click', () => {
            signInWithPopup(auth, facebookProvider)
                .then((result) => alert("ยินดีต้อนรับ: " + result.user.displayName))
                .catch((error) => alert("เกิดข้อผิดพลาด Facebook: " + error.message));
        });
    </script>
</body>
</html>
